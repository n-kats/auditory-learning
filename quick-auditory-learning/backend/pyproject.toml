[project]
name = "quick-auditory-learning-backend"
version = "0.0.0"
description = "Backend for quick auditory learning"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.2.0",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "openai>=1.77.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "psycopg[binary,pool]>=3.2.9",
    "pgvector>=0.3.6",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quick_auditory_learning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["T201", "COM812", "ISC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
